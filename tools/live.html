<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench Live</title>
<style>
/* Tokens. Status is never colour alone: every state also carries an icon and a word. Contrast is checked in tools/live-check.mjs.
   Dark is the default; [data-theme=light] is set from the saved choice or the system. */
:root{
  color-scheme:dark;
  --bg:#0B0F14; --surface:#121820; --surface-2:#1A2230; --border:#263345; --border-strong:#566A85;
  --fg:#E2E8F0; --fg-muted:#8492A6; --focus:#00F0FF;
  --ok:#10B981; --ok-bg:#0A2A20; --warn:#FF9F1C; --warn-bg:#33240A; --bad:#FF5C5C; --bad-bg:#3A1414;
  --hold:#E879F9; --hold-bg:#2E1433; --loop:#818CF8; --loop-bg:#161A3A;
  --codex:#F472B6; --opus:#A78BFA; --sonnet:#38BDF8; --haiku:#34D399; --guard:#00F0FF;
  --ring:rgba(0,240,255,.25); --r:4px;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:22px;
  --sp-1:2px; --sp-2:4px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px; --sp-7:32px;
  --win:var(--bg); --panel:var(--surface); --line:var(--border); --dim:var(--fg-muted); --faint:var(--border-strong);
  --allow:var(--ok); --ask:var(--warn); --block:var(--bad);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F6; --border:#CBD5E1; --border-strong:#7A8BA0;
  --fg:#0F172A; --fg-muted:#5B6B80; --focus:#0E7490;
  --ok:#047857; --ok-bg:#E3F5EF; --warn:#92400E; --warn-bg:#FDF0DC; --bad:#B91C1C; --bad-bg:#FDE8E8;
  --hold:#A21CAF; --hold-bg:#FAE8FF; --loop:#4338CA; --loop-bg:#E0E7FF;
  --codex:#BE185D; --opus:#6D28D9; --sonnet:#0369A1; --haiku:#065F46; --guard:#0E7490;
  --ring:rgba(14,116,144,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs-md)/1.5 var(--sans);font-variant-numeric:tabular-nums}
.page{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-areas:"top top" "nav main" "foot foot";min-height:100vh;align-content:start}
.topbar{grid-area:top}.sidenav{grid-area:nav}.maincol{grid-area:main}.footer{grid-area:foot}
.maincol{min-width:0;padding:0 var(--sp-5) var(--sp-5)}
.mono,.tm,pre,dl.detail dd,.tag{font-family:var(--mono)}

/* timeline */
#tl{height:min(70vh,720px);min-height:320px;overflow:auto;overscroll-behavior:contain;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);position:relative}
.tlbar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-3);font-size:var(--fs-sm)}
.turnhead{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0;background:var(--surface-2);color:var(--fg);padding:var(--sp-3) var(--sp-4);position:sticky;top:0;z-index:2;min-height:30px;font:var(--fs-sm)/1.4 var(--mono);border-left:2px solid var(--focus)}
.turnhead:hover{background:var(--surface-2)}
.turnhead .tt{display:inline-flex;align-items:center;font-weight:700;color:var(--focus);padding:0 8px 0 4px;border:1px solid var(--focus);border-radius:var(--r);text-transform:uppercase;letter-spacing:.06em;font-size:var(--fs-xs)}
.turnhead .tt .ic{width:14px;height:14px;margin-right:2px;transition:transform .15s}.turnhead .tt .rot{transform:rotate(90deg)}
.turnhead .mt{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.mc{display:inline-flex;gap:4px;align-items:center;padding:0 8px;border:1px solid var(--border-strong);border-radius:999px;color:var(--fg-muted);font-size:var(--fs-xs);line-height:18px}
.bgchip{background:transparent;font-family:inherit;cursor:pointer}
.mc .ic{width:12px;height:12px;margin:0}.mc.bad{color:var(--bad);border-color:var(--bad)}.mc.warn{color:var(--warn);border-color:var(--warn)}
.trow:hover .arg,.trow[aria-selected=true] .arg{background:var(--surface);outline:1px solid var(--border)}
.trow .ti{color:var(--fg-muted);margin:0}.trow .tn{font-weight:700;flex:none}.trow .arg{font:var(--fs-xs)/1.6 var(--mono);color:var(--fg-muted);background:var(--surface-2);padding:0 6px;border-radius:var(--r)}
.trow .st .ic{width:12px;height:12px;margin-right:4px}.turnhead .tx{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turnhead .mt{color:var(--fg-muted);font-size:var(--fs-xs)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 150px 64px;gap:var(--sp-3);align-items:center;min-height:26px;padding:0 var(--sp-4);border-bottom:1px solid var(--border);font-size:var(--fs-sm);cursor:pointer;width:100%;text-align:left;border-radius:0;color:var(--fg);background:transparent;border-left:0;border-right:0;border-top:0}
.trow:hover{background:var(--surface-2)}
.trow[aria-selected=true]{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--focus)}
.trow .nm{display:flex;gap:var(--sp-3);align-items:center;min-width:0}
.trow .nm .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trow .tm{color:var(--fg-muted);font-size:var(--fs-xs)}
.trow .nm .st{order:9;margin-left:auto}
.trow .st{display:inline-flex;align-items:center;justify-content:center;min-width:78px;font-size:var(--fs-xs);font-family:var(--mono);padding:0 6px;border:1px solid currentColor;border-radius:var(--r);text-align:center;line-height:18px}
.st.ok{color:var(--ok)}.st.error,.st.blocked,.st.declined{color:var(--bad)}.st.ask,.st.running{color:var(--warn)}.st.bg{color:var(--loop)}
.trow .who{font-size:var(--fs-xs);min-width:64px}
.trow .caret{width:14px;color:var(--fg-muted);flex:none}
.trow .sub2{color:var(--fg-muted);font-size:var(--fs-xs);white-space:nowrap}
.wf{position:relative;height:8px;background:var(--bg);border-radius:var(--r);overflow:hidden}
.wf i{position:absolute;top:0;bottom:0;background:var(--haiku);border-radius:2px;min-width:2px}
.wf i.ok{background:var(--ok)}.wf i.error,.wf i.blocked,.wf i.declined{background:var(--bad)}.wf i.running{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,transparent 4px,transparent 8px)}.wf i.bg{background:var(--loop);opacity:.6}
.trow .ms{text-align:right;font-family:var(--mono);font-size:var(--fs-xs);color:var(--fg-muted)}
.trow.grp{cursor:default;color:var(--fg-muted);font-style:italic}
.markrow{padding:2px var(--sp-4);font-size:var(--fs-xs);color:var(--fg-muted);border-bottom:1px solid var(--border)}
.moreb{margin:var(--sp-3) var(--sp-4)}
.pill{position:sticky;bottom:var(--sp-3);display:block;margin:0 auto;width:max-content;padding:var(--sp-2) var(--sp-4);border-radius:var(--r);background:var(--focus);color:var(--bg);border:0;font-weight:600;z-index:3}
.emptytl{padding:var(--sp-6);color:var(--fg-muted)}
.dwtabs{display:flex;gap:0;margin:var(--sp-3) 0;border-bottom:1px solid var(--border)}
.dwtabs button{border:0;border-bottom:2px solid transparent;border-radius:0;font:600 var(--fs-xs)/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:var(--sp-2) var(--sp-4)}
.dwtabs button[aria-selected=true]{color:var(--focus);border-bottom-color:var(--focus)}
#tl-q{font:var(--fs-sm)/1.4 var(--mono);min-width:220px;flex:1;max-width:420px;padding:3px 8px;background:var(--bg);color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--r);min-height:28px}
#tl-q:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 8px var(--ring)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{display:inline-flex;gap:var(--sp-2);align-items:center;padding:0 var(--sp-3);border-radius:var(--r);background:var(--surface-2);border:1px solid var(--border-strong);color:var(--fg);font-family:var(--mono);font-size:var(--fs-xs);min-height:22px}
mark{background:var(--warn-bg);color:var(--fg);outline:1px solid var(--warn);border-radius:2px}
.trow.ctxrow .nm .tx,.trow.ctxrow .tm{color:var(--fg-muted)}
.trow.crit .nm .tx{font-weight:600}
.trow.crit{box-shadow:inset -3px 0 0 var(--loop)}
.mini{display:block;width:100%;height:48px;margin-bottom:var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);touch-action:none;cursor:crosshair}
.mini .band{fill:var(--border);fill-opacity:.7}.mini .tick.f{stroke:var(--bad)}.mini .tick.a{stroke:var(--warn)}.mini .brush{fill:var(--focus);fill-opacity:.25;stroke:var(--focus)}
.mini .lbl{fill:var(--fg-muted);font-size:9px}
/* tables and lists for the Guard and Agents tabs */
.sect{margin:0 0 var(--sp-5)}
.sech{display:flex;align-items:center;gap:10px;margin:var(--sp-5) 0 var(--sp-3);font:700 var(--fs-lg)/1.3 var(--mono);letter-spacing:-.02em}
#p-flow .cnt,.sech .cnt{margin-left:0;color:var(--fg-muted);border-color:var(--border-strong);font-weight:500}
#p-flow{margin-bottom:var(--sp-5);scroll-margin-top:52px}
.sect h2 .ic{margin-right:8px}
.sect h2{font:700 var(--fs-md)/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;margin:0 0 var(--sp-3)}
.queue{display:flex;flex-direction:column;gap:var(--sp-2)}
.qitem{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);align-items:center;padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);border-left:2px solid var(--warn);border-radius:var(--r);background:var(--surface);font-size:var(--fs-sm)}
.qitem.bad{border-left-color:var(--bad)}.qitem.hold{border-left-color:var(--hold)}
.qitem .grow{flex:1;min-width:160px;overflow-wrap:anywhere}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
table.tbl th{text-align:left;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--fg-muted);font-size:var(--fs-xs);padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border-strong);white-space:nowrap}
table.tbl th button{border:0;padding:0;font:inherit;color:inherit;background:none;min-height:0}
table.tbl td{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--border);vertical-align:top;overflow-wrap:anywhere}
table.tbl tr.clk{cursor:pointer}table.tbl tr.clk:hover{background:var(--surface-2)}
table.tbl th.num{text-align:right}
/* The condition matrix has short columns (check, got, time): they keep their words whole, the command column takes the wrapping. */
#e-matrix td:nth-child(3),#e-matrix td:nth-child(5),#e-matrix td:nth-child(8){white-space:nowrap}#e-matrix td:nth-child(4){overflow-wrap:normal}
table.tbl td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.catbar{display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--bg);min-width:120px}
.catbar i{display:block;height:100%}.catbar .a{background:var(--ok)}.catbar .k{background:var(--warn)}.catbar .b{background:var(--bad)}
.dec{font-family:var(--mono);font-size:var(--fs-xs)}
.dec.allow{color:var(--ok)}.dec.ask,.dec.asking{color:var(--warn)}.dec.block,.dec.declined{color:var(--bad)}
.fchips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3);align-items:center}
.indent{display:inline-block}
/* help, live regions */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
dialog#help{max-width:640px;width:calc(100vw - 32px);background:var(--surface);color:var(--fg);border:1px solid var(--border-strong);border-radius:var(--r);padding:var(--sp-5)}
dialog#help::backdrop{background:rgba(0,0,0,.5)}
dialog#help h2{margin:0 0 var(--sp-3);font-size:var(--fs-lg)}
dialog#help h3{margin:var(--sp-4) 0 var(--sp-2);font-size:var(--fs-md)}
dialog#help dl{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-2) var(--sp-4);margin:0;font-size:var(--fs-sm)}
dialog#help dt{font-family:var(--mono)}dialog#help dd{margin:0;color:var(--fg-muted)}
kbd{font-family:var(--mono);font-size:var(--fs-xs);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:var(--r);padding:0 5px;background:var(--surface-2)}
/* icons: one inline sprite, drawn in the colour of the text around them */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
button .ic{margin-right:6px}
.srch{display:inline-flex;align-items:center;gap:var(--sp-2);flex:1 1 220px;min-width:0;color:var(--fg-muted)}
.srch #tl-q{flex:1}
.cnt{margin-left:auto;font:600 var(--fs-xs)/1.5 var(--mono);padding:0 6px;border:1px solid currentColor;border-radius:999px}
.cnt.warn{color:var(--warn)}
.k-i{position:absolute;top:10px;right:10px;color:var(--fg-muted)}
.tile.bad .k-i{color:var(--bad)}.tile.warn .k-i{color:var(--warn)}.tile.ok .k-i{color:var(--ok)}
.tile .k-l{padding-right:26px}
.tile .k-v{font-size:clamp(22px,2.4vw,30px)}
/* intent, evidence, guard ribbon, team gates */
.goalcard{padding:var(--sp-4);background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--focus);border-radius:var(--r);margin-bottom:var(--sp-3)}
.goalcard h3{margin:var(--sp-2) 0 0;font:700 var(--fs-lg)/1.4 var(--sans)}
.goalcard .bh{display:flex;justify-content:space-between;gap:8px;font:600 var(--fs-xs)/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted)}
.hud{margin:var(--sp-3) 0}
.hud .stat{padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:120px}
.banner{display:flex;gap:var(--sp-3);align-items:center;margin:var(--sp-3) 0;padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border-strong);border-radius:var(--r);font-size:var(--fs-sm)}
.banner.warn{border-left-color:var(--warn);color:var(--fg)}.banner.ok{border-left-color:var(--ok)}
.banner .ic{margin:0}.banner.warn .ic{color:var(--warn)}.banner.ok .ic{color:var(--ok)}
.conds{display:flex;flex-direction:column;gap:var(--sp-2)}
.cond{display:flex;gap:var(--sp-4);align-items:center;padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.cond .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.cpill{display:inline-flex;gap:4px;align-items:center;padding:0 8px;border:1px solid currentColor;border-radius:999px;font:var(--fs-xs)/18px var(--mono);white-space:nowrap}
.cpill .ic{width:12px;height:12px;margin:0}
.cpill.verified{color:var(--ok);background:var(--ok-bg)}.cpill.failed{color:var(--bad);background:var(--bad-bg)}.cpill.pending{color:var(--fg-muted)}.cpill.observed,.cpill.waived{color:var(--warn);background:var(--warn-bg)}
.seg{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-4)}
.seg-i{display:inline-flex;gap:6px;align-items:center;padding:var(--sp-2) var(--sp-4);border:1px solid var(--border-strong);border-radius:var(--r);font:600 var(--fs-xs)/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-muted)}
.seg-i .ic{width:14px;height:14px;margin:0}
.seg-i.on{color:var(--focus);border-color:var(--focus);background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--focus)}
.phead{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-5);align-items:center;padding:var(--sp-4);margin-bottom:var(--sp-3);background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--focus);border-radius:var(--r)}
.phead-t{display:flex;gap:var(--sp-2);align-items:center;margin:0;font:700 var(--fs-lg)/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em}.phead-t .ic{color:var(--focus);margin:0}
.phead .seg{margin:0}.phead-meta{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;margin-left:auto}
.phead-sub{flex-basis:100%;margin:0;color:var(--fg-muted);font-size:var(--fs-sm)}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)}
.tile.static{cursor:default}.tile.static:hover{border-color:var(--border);background:var(--surface)}
.tile.static.bad:hover{border-color:var(--bad)}.tile.static.warn:hover{border-color:var(--warn)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-4);align-items:start}
@media (min-width:1200px){.pgrid{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}}
.pmain,.pside{min-width:0}
.panel{padding:var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-1) var(--sp-4);margin:0 0 var(--sp-3);font-size:var(--fs-sm)}
.kv dt{color:var(--fg-muted);font:var(--fs-xs)/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em}.kv dd{margin:0;font-family:var(--mono);text-align:right;overflow-wrap:anywhere}
.pside .tbl td:first-child{white-space:nowrap}
.askcard{flex-direction:column;align-items:stretch;gap:var(--sp-2);border-left-width:3px}
.askcard .ah,.askcard .ab,.askcard .aa{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);align-items:center}
.askcard .ah code{font-size:var(--fs-md);overflow-wrap:anywhere}.askcard .ab{color:var(--fg-muted);font-size:var(--fs-sm)}.askcard .aa{justify-content:flex-end}
.tbl tr.d-block td:first-child,.tbl tr.d-declined td:first-child{box-shadow:inset 2px 0 var(--bad)}.tbl tr.d-asking td:first-child,.tbl tr.d-ask td:first-child{box-shadow:inset 2px 0 var(--warn)}
@media (max-width:820px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}.phead-meta{margin-left:0}}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--sp-3)}
.acard{--accent:var(--focus);display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:var(--r)}
.acard.sonnet{--accent:var(--sonnet)}.acard.opus{--accent:var(--opus)}.acard.haiku{--accent:var(--haiku)}.acard.codex{--accent:var(--codex)}
.acard .ah{display:flex;gap:var(--sp-2);align-items:center;justify-content:space-between;flex-wrap:wrap}.acard .ah b{font:700 var(--fs-md)/1.3 var(--mono);color:var(--accent)}
.acard .am{font:600 var(--fs-md)/1.3 var(--mono);overflow-wrap:anywhere}.acard .kv{margin:0}.acard .resp{margin:0;color:var(--fg-muted);font-size:var(--fs-sm)}
.gate .kv{margin:0;font-size:var(--fs-xs)}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-3)}
.gate{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--border-strong);border-radius:var(--r)}
.gate.hot{border-top-color:var(--warn)}
.gate b{display:flex;gap:8px;align-items:center;font:700 var(--fs-md)/1.3 var(--mono)}.gate b .ic{color:var(--focus);margin:0}
.wbchips{display:inline-flex;flex-wrap:wrap;gap:var(--sp-2)}
.wbchips .mc{background:var(--surface);color:var(--fg)}.wbchips .mc.ok{color:var(--ok)}.wbchips .mc.warn{color:var(--warn)}
@media(max-width:1099px){.wbchips{display:none}}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--sp-3);margin:var(--sp-4) 0}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

// Every redraw that is not the one in the queue keeps the focus where the keyboard was.
function drawGraphFocus(refocus){ withFocus(function(){ drawGraph(refocus); }); }
function graphInit(){

  [['all', ''], ['source', 'source'], ['test', 'test'], ['config', 'config']].forEach(function(p){ $('gr-cat-' + p[0]).onclick = function(){ GR.cat = p[1]; GR.key = ''; drawGraphFocus(); }; });
  // While the tab is open the graph is asked for again now and then (the server builds only what changed).

}

// ---- tabs: roving tabindex, the choice kept in the address and in storage ----
var TABS = ['timeline', 'intent', 'guard', 'evidence', 'agents', 'graph'], tab = 'timeline';
function showTab(name, focusIt){
  // flow is no longer a view of its own: the address, the saved choice and the key still lead to its section
  var toFlow = name === 'flow';

function tabsBuild(){
  TABS.forEach(function(t){ $('tab-' + t).onclick = function(){ showTab(t); }; });

  $('k-ask').onclick = function(){ showTab('guard'); };

  if (window.swbApp && typeof window.swbApp.openStatus === 'function') { var openApp = function(){ window.swbApp.openStatus(); }; $('appstatus').hidden = false; $('appstatus').onclick = openApp; $('g-open-status').hidden = false; $('g-open-status').onclick = openApp; }

}
function translate(){

  $('g-open-status').textContent = T('g-open-status');
  lbl($('theme'), theme === 'dark' ? 'sun' : 'moon', theme === 'dark' ? T('th-light') : T('th-dark'));
  $('theme').title = L('switch theme', '테마 바꾸기');
  $('lang').setAttribute('aria-describedby', 'title');
  [['tl', 'timeline', '타임라인'], ['mini', 'overview of the whole buffer: drag to zoom', '버퍼 전체 개요: 끌어서 확대'], ['tl-q', 'search', '검색'], ['tl-prev', 'previous match', '이전 일치'], ['tl-next', 'next match', '다음 일치'], ['tabs', 'views', '화면'], ['stabs', 'sessions', '세션'], ['kpis', 'metrics', '지표'], ['helpb', 'help', '도움말'], ['drawer', 'details', '상세'], ['dw-close', 'close', '닫기']].forEach(function(a){ $(a[0]).setAttribute('aria-label', L(a[1], a[2])); });
  Object.keys(edgeEl).forEach(function(id){ if (edgeEl[id].hitEl) edgeEl[id].hitEl.setAttribute('aria-label', edgeLabel(id)); });
  syncTools();

  $('state').textContent = connected ? T('st-live') : down ? T('st-down') : everOpened ? T('st-reconnect') : T('st-wait');
  $('state').className = 'conn ' + (connected ? 'ok' : down ? 'bad' : 'warn');
}
function replay(){
  $('tl').setAttribute('aria-busy', 'true');
  endPlayback(true);
  if (!paused) { pending.splice(0).forEach(function(e){ events.push(e); }); if (events.length > 2000) events.splice(0, events.length - 2000); }
  replaying = true;
  try { reset(); events.forEach(handle); } finally { replaying = false; }
  translate();
  render();
  applyFilter();
  queueView();
  // The page was rebuilt from the buffer: what it holds now is not "new", and the screen reader is not told it all again.
  tl.seenOrder = TR.order; said = { order: TR.order, fails: TR.failTotal };
  $('tl').setAttribute('aria-busy', 'false');
}
$('lang').onclick = function(){
  lang = lang === 'ko' ? 'en' : 'ko';
  try { localStorage.setItem('swb-lang', lang); } catch (e) {}
  replay();
};
$('clear').onclick = function(){ events = []; pending = []; srvBase = srv ? srv.linesRead : 0; replay(); resetViews(); drawSrv(); };

var connected = false, everOpened = false, es = null;
// One page, many sessions: when the server is a hub, every session has its own buffer and a tab; the one shown is wired to the views above.
var resync = false, hubSync = false, hub = false, CTX = Object.create(null), ORDER = [], curId = null, closedIds = Object.create(null), badgeTimer = 0;
function ctxOf(id){
  var c = CTX[id];
  if (!c) { c = CTX[id] = { id: id, name: id, project: '', startedAt: 0, alive: true, events: [], pending: [], srv: null, srvBase: 0, badge: { n: 0, ask: 0 }, ui: { tab: null, sel: null, q: '' } }; }
  return c;
}
function renderSessions(){
  var bar = $('stabs');
  bar.hidden = !hub;
  if (!hub) return;
  var active = document.activeElement && document.activeElement.parentNode === bar ? document.activeElement : null;
  var keep = active ? (active.hasAttribute('data-sx') ? 'data-sx' : 'data-sid') : null, keepId = active && keep ? active.getAttribute(keep) : null;
  while (bar.firstChild) bar.removeChild(bar.firstChild);
  ORDER.forEach(function(id){
    var c = CTX[id]; if (!c) return;
    var on = id === curId;
    var b = el('button', c.alive ? '' : 'gone');
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; b.setAttribute('data-sid', id);
    b.appendChild(el('span', 'sn', cut(c.name, 24)));
    if (!on && c.badge.ask) b.appendChild(el('span', 'sb ask', String(c.badge.ask)));
    else if (!on && c.badge.n) b.appendChild(el('span', 'sb', c.badge.n > 99 ? '99+' : String(c.badge.n)));
    b.title = c.project + (c.alive ? '' : '\n' + (c.quiet ? L('no heartbeat, but the process still runs (asleep, stopped or busy)', '하트비트가 끊겼지만 프로세스는 살아 있음(절전·정지·바쁨)') : L('this session has ended', '끝난 세션'))) + (c.startedAt ? '\n' + L('started ', '시작 ') + clock(c.startedAt) : '');

    bar.appendChild(b);
    if (!c.alive && !c.quiet) {
      var x = el('button', 'sx', '×'); x.setAttribute('data-sx', id);
      x.title = L('close this ended session', '끝난 세션 닫기'); x.setAttribute('aria-label', x.title);
      x.onclick = function(){ closeSession(id); };
      bar.appendChild(x);
    }

}
function queueBadges(){ if (!badgeTimer) badgeTimer = setTimeout(function(){ badgeTimer = 0; renderSessions(); }, 300); }
function switchTo(id){
  if (!CTX[id] || id === curId) return;
  if (playback) endPlayback(true);
  if (paused) setPaused(false);
  var old = CTX[curId];
  if (old) { old.events = events; old.pending = pending; old.srv = srv; old.srvBase = srvBase; old.ui = { tab: tab, sel: tl.sel, q: tlq.text }; }
  curId = id;
  var c = CTX[id];
  events = c.events; pending = c.pending; srv = c.srv; srvBase = c.srvBase; c.badge = { n: 0, ask: 0 };
  store('swb-session', id);
  replay(); resetViews();
  if (c.ui.sel) { tl.sel = c.ui.sel; tl.pendingReveal = c.ui.sel; }
  setQuery(c.ui.q || '');
  showTab(c.ui.tab || tab);
  drawSrv(); pollInfo(); renderSessions();
}
function closeSession(id){
  // Remembered with the start time: a later session that reuses the id is a different session and is shown.
  closedIds[id] = CTX[id] ? CTX[id].startedAt : 1;
  var wasCurrent = id === curId;
  delete CTX[id];
  ORDER = ORDER.filter(function(one){ return one !== id; });
  if (wasCurrent) {
    curId = null;
    var next = ORDER.filter(function(one){ return CTX[one].alive; })[0] || ORDER[0];
    events = []; pending = []; srv = null;
    if (next) switchTo(next); else { replay(); resetViews(); drawSrv(); }
  }
  renderSessions();
}
function freshStart(){
  if (!resync) return;
  resync = false;
  if (hub) {
    Object.keys(CTX).forEach(function(id){ CTX[id].events = []; CTX[id].pending = []; CTX[id].srvBase = 0; CTX[id].badge = { n: 0, ask: 0 }; });
    if (CTX[curId]) { events = CTX[curId].events; pending = CTX[curId].pending; } else { events = []; pending = []; }
  } else { events = []; pending = []; }
  replay(); resetViews();
}
function onSessions(m){
  try {
    freshStart();
    var data = JSON.parse(m.data);
    var rows = data && Array.isArray(data.sessions) ? data.sessions : [];
    var seen = Object.create(null);
    rows.forEach(function(row){
      if (!row || !/^[A-Za-z0-9_-]{1,64}$/.test(String(row.id))) return;
      if (closedIds[row.id]) { if (Number(row.startedAt) <= closedIds[row.id]) return; delete closedIds[row.id]; }
      seen[row.id] = true;
      var c = ctxOf(row.id);
      c.name = String(row.name || row.id); c.project = String(row.project || ''); c.startedAt = Number(row.startedAt) || 0; c.alive = !!row.alive; c.quiet = !!row.quiet;
    });
    Object.keys(CTX).forEach(function(id){ if (!seen[id] && id !== curId) delete CTX[id]; else if (!seen[id]) { CTX[id].alive = false; CTX[id].quiet = false; } });
    ORDER = Object.keys(CTX).sort(function(a, b){ return CTX[a].startedAt - CTX[b].startedAt; });
    if (!curId || !CTX[curId]) {
      var want = parseHash(location.hash).s || stored('swb-session');
      var first = (want && CTX[want]) ? want : ORDER.filter(function(one){ return CTX[one].alive; })[0] || ORDER[0];
      if (first) { curId = null; events = []; pending = []; switchTo(first); }
    }
    renderSessions();
  } catch (e) { pageError('sessions', e); }
}
function onHubLine(m){
  try {
    freshStart();
    var f = JSON.parse(m.data), ev = f && f.e;
    if (!f || !ev || typeof ev !== 'object' || !/^[A-Za-z0-9_-]{1,64}$/.test(String(f.s)) || closedIds[f.s]) return;
    if (f.s === curId) { if (paused || playback) holdBack(ev); else take(ev); return; }
    var c = ctxOf(f.s);
    c.events.push(ev); if (c.events.length > 2000) c.events.shift();
    // What the hub replays when a page connects is history, not news: it is not counted.
    if (!hubSync) c.badge.n++;
    if (!hubSync && ((ev.kind === 'tool.start' && ev.policy === 'ask') || ev.kind === 'guard.block')) c.badge.ask++;
    queueBadges();
  } catch (e) { pageError('event', e); }
}
function openStream(){
  es = new EventSource(hub ? '/events?all=1' : '/events');
  es.onopen = function(){
    srvBase = 0; setTimeout(pollInfo, 1500);
    if (hub) hubSync = true;
    // The server sends its whole buffer again on every connection. What the page shows is kept until that arrives, so a connection that
    // opens but delivers nothing (a proxy holding the stream back) does not blank a screen that was fine a moment ago.
    if (everOpened) resync = true;
    connected = true; everOpened = true; translate();
  };
  es.onerror = function(){ connected = false; translate(); };
  if (hub) { es.addEventListener('sessions', onSessions); es.addEventListener('line', onHubLine); es.addEventListener('ready', function(){ hubSync = false; renderSessions(); }); }
  else es.onmessage = function(m){
    try { freshStart(); var ev = JSON.parse(m.data); if (!ev || typeof ev !== 'object') return; if (paused || playback) holdBack(ev); else take(ev); } catch (e) { pageError('event', e); }
  };
}
window.addEventListener('hashchange', function(){ var w = parseHash(location.hash).s; if (hub && w && w !== curId && CTX[w]) switchTo(w); });
if (typeof fetch === 'function') {
  fetch('/info', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(info){ hub = !!(info && info.hub === 'smartworkbench'); }).catch(function(){}).then(openStream);
} else openStream();
// Answering a guard question from this page needs a token: the desktop app opens its own window with a one-time code in the address, which is
// traded for the token here and removed from the address at once. A page opened any other way only shows the question.
var TOKEN = '';
try { TOKEN = sessionStorage.getItem('swb-token') || ''; } catch (e) {}
(function(){
  var m = /[#&]pair=([0-9a-f]{32})(?:&|$)/.exec(location.hash);
  if (!m || typeof fetch !== 'function') return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  fetch('/pair', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: m[1] }) })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && typeof j.token === 'string') { TOKEN = j.token; try { sessionStorage.setItem('swb-token', TOKEN); } catch (e) {} render(); } })
    .catch(function(){});
})();
function answerAsk(rec, allow){
  if (rec.busy || typeof fetch !== 'function') return;
  rec.busy = true; rec.msg = ''; render();
  fetch('/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session: hub ? curId : '', id: rec.id, allow: allow, token: TOKEN }) })
    .then(function(r){ if (r.status === 403) { TOKEN = ''; try { sessionStorage.removeItem('swb-token'); } catch (e) {} } return r.json().catch(function(){ return null; }); })
    .then(function(j){
      rec.busy = false;
      if (j && j.status === 'applied') rec.msg = L('answered', '답했습니다');
      else if (j && j.status === 'rejected') { rec.refused = String(j.reason || ''); rec.msg = ''; }
      else if (j && j.status === 'waiting') rec.msg = L('sent; waiting for the session', '보냈습니다. 세션의 응답을 기다리는 중');
      else rec.msg = L('could not answer here', '여기서 답하지 못했습니다');
      render();
    })
    .catch(function(){ rec.busy = false; rec.msg = L('could not answer here', '여기서 답하지 못했습니다'); render(); });
}
pollInfo();
flowBuild();
uiBuild();
timelineBuild();
helpBuild();
tabsBuild();
reset();
translate();
render();
if (window.ResizeObserver) { var ro = new ResizeObserver(queueLayout); ro.observe($('grid')); Object.keys(boxes).forEach(function(n){ ro.observe(boxes[n]); }); }
window.addEventListener('resize', queueLayout);
document.addEventListener('visibilitychange', function(){ if (document.hidden) { queue = []; } });
setTimeout(function(){ document.body.classList.add('ready'); }, 1500);
</script>
